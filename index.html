<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>能力角色仪 | 冒险者检定与出卡</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./world-recruitment-home.css" />
    <script>
      // 无征召交接参数、且没有进行中档案时，入口改走高保真「世界征召令」原型
      (function () {
        var params = new URLSearchParams(location.search);
        var keepApp =
          params.has("race") ||
          params.has("target") ||
          params.get("continue") === "1" ||
          params.get("from") === "hall";
        if (!keepApp) {
          try {
            var saved = JSON.parse(sessionStorage.getItem("abilityState") || "null");
            if (saved && saved.screen && saved.screen !== "start") keepApp = true;
          } catch (e) {}
        }
        if (!keepApp) {
          location.replace("./world-recruitment-prototype.html");
        }
      })();
    </script>
  </head>
  <body>
    <canvas id="ambient-canvas" aria-hidden="true"></canvas>
    <div class="app-shell">
      <header class="topbar">
        <button class="brand" id="brandHome" type="button" aria-label="返回开始页">
          <span class="brand-mark">A6</span>
          <span>
            <strong>能力角色仪</strong>
            <small>掷骰建卡 / 冒险者名册</small>
          </span>
        </button>
        <div class="topbar-meta">
          <span id="progressLabel">公会柜台待命</span>
          <div class="progress-track" aria-hidden="true">
            <span id="progressBar"></span>
          </div>
        </div>
      </header>

      <main id="app" class="app-main"></main>
    </div>

    <script src="./data/mbti-dnd-evaluations.js"></script>
    <script src="./data/quiz-copy.js"></script>
    <script src="./data/constitution-copy.js"></script>
    <script src="./data/defect-card-assets.js"></script>
    <script src="./data/race-recruitment-assets.js"></script>
    <script src="./data/race-recruitment-troll.js"></script>
    <script src="./data/race-recruitment-human.js"></script>
    <script src="./data/race-recruitment-elf.js"></script>
    <script src="./data/race-recruitment-dwarf.js"></script>
    <script src="./data/race-recruitment-halfling.js"></script>
    <script src="./data/race-recruitment-half-orc.js"></script>
    <script src="./data/race-recruitment-tiefling.js"></script>
    <script src="./data/race-recruitment-dragonborn.js"></script>
    <script src="./data/race-recruitment-ogre-giant.js"></script>
    <script src="./world-recruitment-home.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
