<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>世界征召令 | 冒险者工会联合征募</title>
  <style>
    :root {
      --paper: #f0e6d2;
      --paper-dark: #e3d6b8;
      --ink: #2b2118;
      --ink-light: #5c4d3c;
      --accent-gold: #c9a45c;
      --accent-red: #a34f3e;
      --human-primary: #c9a45c;
      --human-secondary: #a34f3e;
      --elf-primary: #7a9e7e;
      --elf-secondary: #c9b86a;
      --orc-primary: #4a5a3a;
      --orc-secondary: #8c4b3a;
      --tiefling-primary: #7a2e2e;
      --tiefling-secondary: #d4af37;
      --shadow: rgba(43, 33, 24, 0.18);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      min-height: 100dvh;
      background-color: #241910;
      color: var(--ink);
      font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", Georgia, serif;
      overflow-x: hidden;
    }

    /* 木桌单独铺满视口，不跟内容一起被压扁 */
    .wood-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-color: #241910;
      background-image: url("assets/ui/recruitment-kit-v2/wood_table.png");
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
      pointer-events: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      box-sizing: border-box;
    }

    .paper-grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.22;
      mix-blend-mode: multiply;
      background-image:
        url("assets/ui/recruitment-kit-v2/grunge_texture.png"),
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(43,33,24,0.03) 2px, rgba(43,33,24,0.03) 3px),
        repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(43,33,24,0.02) 2px, rgba(43,33,24,0.02) 3px);
      background-size: 520px 520px, auto, auto;
      background-repeat: repeat, repeat, repeat;
      z-index: 0;
    }

    /* 旧桌面碎纸/地图装饰与演示图不符，关闭 */
    .desk-layers { display: none !important; }

    /* 舞台：宽度按视口高度反推，保证整纸可见且不拉伸 */
    .poster-stage {
      position: relative;
      z-index: 1;
      width: min(1280px, 94vw, calc((100dvh - 20px) * 1.5));
      margin: 0 auto;
    }

    .poster-shell {
      position: relative;
      z-index: 2;
      width: 100%;
      margin: 0;
      line-height: 0;
      filter: drop-shadow(0 16px 24px rgba(0,0,0,0.55));
    }

    /* 高度跟图走，禁止 fill */
    .poster-art {
      display: block;
      position: relative;
      width: 100%;
      height: auto;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }

    /* 内容落在羊皮纸心 —— 百分比相对纸面 */
    .poster-ui {
      position: absolute;
      inset: 6% 7.5% 7% 7.5%;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      gap: 3px;
      line-height: normal;
    }

    /* 左侧会旗 —— 演示图左上探出 */
    .prop-banner {
      position: absolute;
      left: -3.5%;
      top: 6%;
      width: 11%;
      height: 52%;
      background: url("assets/ui/recruitment-kit/banner.png") center top / contain no-repeat;
      pointer-events: none;
      z-index: 3;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.4));
    }

    /* 右上角改小蜡印，别用大圆环盖住纸面 */
    .prop-crest {
      position: absolute;
      right: 8%;
      top: 4%;
      width: 4.5%;
      aspect-ratio: 1;
      background: url("assets/ui/recruitment-kit/wax_seal.png") center / contain no-repeat;
      pointer-events: none;
      z-index: 3;
      opacity: 0.88;
      transform: rotate(12deg);
      filter: drop-shadow(0 3px 5px rgba(0,0,0,0.35));
    }

    /* 左上角小蜡封 —— 演示图 */
    .prop-seal-tl {
      position: absolute;
      left: 7%;
      top: 3.5%;
      width: 5%;
      aspect-ratio: 1;
      background: url("assets/ui/recruitment-kit/wax_seal.png") center / contain no-repeat;
      pointer-events: none;
      z-index: 3;
      opacity: 0.9;
      transform: rotate(-18deg);
      filter: drop-shadow(0 3px 5px rgba(0,0,0,0.35));
    }

    /* 演示图桌面道具：左下蜡烛、右下羽笔 */
    .prop-candle {
      position: absolute;
      left: 1%;
      bottom: -2%;
      width: 9%;
      aspect-ratio: 1;
      background: url("assets/ui/recruitment-kit-v2/prop_candle.png") center / contain no-repeat;
      pointer-events: none;
      z-index: 4;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.45));
    }

    .prop-quill {
      position: absolute;
      right: 0.5%;
      bottom: -1%;
      width: 11%;
      aspect-ratio: 1;
      background: url("assets/ui/recruitment-kit-v2/prop_quill.png") center / contain no-repeat;
      pointer-events: none;
      z-index: 4;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.4));
    }

    /* 接受条旁蜡封 —— 演示图右下角常显 */
    .accept-zone .wax-seal {
      /* merged into .wax-seal below */
    }

    .app { /* legacy */ }

    .poster-header {
      text-align: center;
      flex: 0 0 auto;
      padding: 0;
      margin: 0 0 2px;
      border: none;
      background: none;
      position: relative;
      z-index: 5;
    }

    .race-row {
      flex: 0 0 auto;
      min-height: 0;
      position: relative;
      z-index: 2;
    }

    /* 演示图：种族四卡 + 职业叠同一上半区 */
    .select-band {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(168px, 24%);
      gap: 12px 16px;
      align-items: end;
      flex: 0 0 auto;
      min-height: 0;
    }

    .character-figure {
      width: 100%;
      aspect-ratio: 2 / 3;
      max-height: min(168px, 23vh);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      position: relative;
      transition: transform 0.35s ease, filter 0.35s ease, box-shadow 0.2s;
      transform-origin: bottom center;
      padding: 0;
    }

    .character-slot[data-selected="true"] .character-figure {
      transform: scale(1.05);
      filter: brightness(1.08);
    }

    /* 标题：演示图是纸上墨字 + 纹章，不用厚红牌抢视觉 */
    .title-plaque {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-width: auto;
      padding: 2px 8px;
      background: none;
      filter: none;
    }

    .title-plaque::before {
      content: "";
      width: 42px;
      height: 42px;
      background: url("assets/ui/recruitment-kit/crossed_hammers.png") center / contain no-repeat;
      flex: 0 0 auto;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
    }

    h1 {
      font-size: clamp(1.7rem, 3.2vw, 2.6rem);
      margin: 0;
      letter-spacing: 0.28em;
      font-weight: 900;
      color: #1a120c;
      text-shadow: 0 1px 0 rgba(255,240,210,0.35);
    }

    .subtitle {
      margin-top: 2px;
      font-size: clamp(0.62rem, 1.1vw, 0.78rem);
      letter-spacing: 0.2em;
      color: var(--ink-light);
    }

    .subtitle::before,
    .subtitle::after {
      content: "—";
      margin: 0 0.4em;
      opacity: 0.7;
    }

    /* 演示图结构：种族横排满宽 → 下方「详情 | 职业」 */
    .characters {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(8px, 1.2vw, 14px);
      width: 100%;
      margin: 0;
      position: relative;
      z-index: 2;
      align-items: end;
    }

    /* 种族说明单独一行，在种族卡下方左侧（演示图） */
    .race-info-box {
      margin-top: 2px;
      border: none;
      background: transparent;
      padding: 2px 8px 2px 2px;
      min-height: 0;
      position: relative;
      box-shadow: none;
      flex: 0 0 auto;
      max-width: 72%;
    }

    .detail-row { display: none; }

    .career-zone {
      position: relative;
      min-height: 0;
      background: transparent;
      border: none;
      box-shadow: none;
      padding-top: 0;
      align-self: end;
      justify-self: center;
    }

    .career-zone-title {
      text-align: center;
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      margin-bottom: 4px;
      color: var(--ink-light);
    }

    .card-stack {
      position: relative;
      width: 150px;
      height: 178px;
      margin: 0 auto;
    }

    .career-card {
      position: absolute;
      width: 136px;
      height: 170px;
      left: 50%;
      top: 50%;
      margin-left: -68px;
      margin-top: -85px;
      border: 1px solid rgba(43,33,24,0.7);
      background: #efe2c4;
      border-radius: 1px;
      box-shadow: 3px 4px 8px rgba(0,0,0,0.22);
      transform-origin: center bottom;
      transition: transform 0.35s ease, z-index 0s linear 0s;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .info-panels {
      margin-top: 2px;
      flex: 1 1 auto;
      min-height: 120px;
      display: flex;
      flex-direction: column;
    }

    .accept-zone {
      margin-top: 4px;
      text-align: center;
      position: relative;
      min-height: 44px;
      flex: 0 0 auto;
    }

    @media (max-width: 900px) {
      .poster-stage { width: min(960px, 98vw); }
      .poster-ui { inset: 5.5% 6% 6.5%; }
      .select-band { grid-template-columns: 1fr 160px; }
      .prop-banner { width: 9%; opacity: 0.85; }
      .character-figure { max-height: 130px; }
    }

    @media (max-width: 640px) {
      body { display: block; padding: 8px; align-items: stretch; }
      .poster-stage { width: 100%; max-height: none; }
      .poster-art { max-height: none; }
      .poster-ui { inset: 5% 6% 6%; }
      .select-band { grid-template-columns: 1fr; }
      .characters { width: 100%; }
      .race-info-box { max-width: 100%; }
      .prop-banner, .prop-crest, .prop-seal-tl, .prop-candle, .prop-quill { display: none; }
    }

    .character-slot {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      min-height: 0;
      width: 100%;
      cursor: pointer;
      transition: transform 0.25s ease;
      background: transparent;
      border: none;
      padding: 0;
      font-family: inherit;
      color: inherit;
    }

    .character-slot:hover .character-figure {
      box-shadow: 0 0 0 2px var(--accent-gold);
    }

    .character-name {
      margin-top: 4px;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      font-weight: 700;
      text-align: center;
      line-height: 1.25;
    }

    .character-name .en-name {
      display: block;
      font-size: 0.58rem;
      letter-spacing: 0.14em;
      color: var(--ink-light);
      font-weight: 500;
    }

    .career-zone {
      position: relative;
      min-height: 0;
      background: transparent;
      border: none;
      box-shadow: none;
      padding-top: 0;
      margin-top: 0;
      align-self: stretch;
    }

    .career-zone-title {
      text-align: center;
      font-size: 0.88rem;
      letter-spacing: 0.08em;
      margin: 0 0 12px;
      color: var(--ink);
      font-weight: 700;
    }

    .card-stack {
      position: relative;
      width: 190px;
      height: 270px;
      margin: 0 auto;
    }

    .career-card {
      position: absolute;
      width: 172px;
      height: 248px;
      left: 50%;
      top: 50%;
      margin-left: -86px;
      margin-top: -124px;
      border: 1px solid rgba(43,33,24,0.7);
      background: #efe2c4;
      border-radius: 1px;
      box-shadow: 4px 6px 12px rgba(0,0,0,0.25);
      transform-origin: center bottom;
      transition: transform 0.35s ease, z-index 0s linear 0s;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 关掉脉冲光效；选中用金纹环框 */
    .burst-overlay {
      display: none !important;
    }

    .character-slot[data-selected="true"] .character-figure { transform: scale(1.04); filter: brightness(1.06); }

    .selection-ring {
      position: absolute;
      inset: -12% -8%;
      background-image: url("assets/ui/recruitment-kit/ornate_ring.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
      z-index: 3;
      filter: drop-shadow(0 0 4px rgba(201,164,92,0.55));
    }

    .character-slot[data-selected="true"] .selection-ring { opacity: 0.92; }

    .character-art {
      width: 100%;
      aspect-ratio: 2 / 3;
      background-repeat: no-repeat;
      background-position: center 18%;
      background-size: cover;
      border: 2px solid var(--ink);
      border-radius: 3px;
      box-shadow: 0 8px 16px rgba(43,33,24,0.35), inset 0 0 0 1px rgba(255,255,255,0.25);
      position: relative;
      z-index: 2;
      transition: box-shadow 0.35s ease;
    }

    .character-slot[data-race="human"][data-selected="true"] .character-art { box-shadow: 0 0 0 3px var(--human-primary), 0 10px 18px rgba(43,33,24,0.4); }
    .character-slot[data-race="elf"][data-selected="true"] .character-art { box-shadow: 0 0 0 3px var(--elf-primary), 0 10px 18px rgba(43,33,24,0.4); }
    .character-slot[data-race="half_orc"][data-selected="true"] .character-art { box-shadow: 0 0 0 3px var(--orc-primary), 0 10px 18px rgba(43,33,24,0.4); }
    .character-slot[data-race="tiefling"][data-selected="true"] .character-art { box-shadow: 0 0 0 3px var(--tiefling-primary), 0 10px 18px rgba(43,33,24,0.4); }

    /* 内部素材：种族征召插画（真实生成图，替代占位剪影） */
    .art-human { background-image: url("assets/recruitment/generated/race_human_card-preview.webp"); }
    .art-elf { background-image: url("assets/recruitment/generated/race_elf_card-preview.webp"); }
    .art-orc { background-image: url("assets/recruitment/generated/race_half_orc_card-preview.webp"); }
    .art-tiefling { background-image: url("assets/recruitment/generated/race_tiefling_card-preview.webp"); }

    /* 选中光效 */
    .burst-overlay {
      position: absolute;
      inset: -10% -5% 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.35s ease;
      z-index: -1;
    }

    [data-race="human"] .burst-overlay,
    [data-race="elf"] .burst-overlay {
      background:
        conic-gradient(from 0deg at 50% 60%, var(--human-primary) 0deg 30deg, transparent 30deg 40deg, var(--human-secondary) 40deg 80deg, transparent 80deg 110deg, var(--human-primary) 110deg 150deg, transparent 150deg 180deg, var(--human-secondary) 180deg 220deg, transparent 220deg 250deg, var(--human-primary) 250deg 290deg, transparent 290deg 320deg, var(--human-secondary) 320deg 360deg);
      mix-blend-mode: multiply;
      animation: rotate-slow 18s linear infinite;
    }

    [data-race="elf"] .burst-overlay {
      background:
        conic-gradient(from 180deg at 50% 60%, var(--elf-primary) 0deg 24deg, transparent 24deg 36deg, var(--elf-secondary) 36deg 72deg, transparent 72deg 96deg, var(--elf-primary) 96deg 132deg, transparent 132deg 156deg, var(--elf-secondary) 156deg 192deg, transparent 192deg 216deg, var(--elf-primary) 216deg 252deg, transparent 252deg 276deg, var(--elf-secondary) 276deg 312deg, transparent 312deg 336deg, var(--elf-primary) 336deg 360deg);
      animation-direction: reverse;
    }

    [data-race="half_orc"] .burst-overlay,
    [data-race="tiefling"] .burst-overlay {
      background:
        repeating-radial-gradient(circle at 50% 55%, transparent 0 10px, var(--orc-primary) 11px 13px, transparent 14px 26px);
      mix-blend-mode: multiply;
      animation: breathe 2.2s steps(4) infinite, rotate-slow 22s linear infinite;
    }

    [data-race="tiefling"] .burst-overlay {
      background:
        repeating-radial-gradient(circle at 48% 52%, transparent 0 8px, var(--tiefling-primary) 9px 11px, transparent 12px 20px, var(--tiefling-secondary) 21px 23px, transparent 24px 36px);
    }

    .character-slot[data-selected="true"] .burst-overlay { opacity: 0.22; }
    .character-slot:not([data-selected="true"]) { filter: brightness(0.94) saturate(0.92); }

    @keyframes rotate-slow { to { transform: rotate(360deg); } }
    @keyframes breathe {
      0%, 100% { opacity: 0.35; }
      25% { opacity: 0.55; }
      50% { opacity: 0.75; }
      75% { opacity: 0.55; }
    }

    /* 种族名 */
    .character-name .selected-mark {
      display: none;
      font-size: 0.62rem;
      color: var(--accent-red);
      letter-spacing: 0;
    }

    [data-selected="true"] .selected-mark { display: inline; }

    /* 介绍区：与职业叠卡同一行 */
    .race-info-box {
      margin-top: 0;
      border: none;
      background: transparent;
      padding: 4px 8px 4px 4px;
      min-height: 0;
      position: relative;
      box-shadow: none;
    }

    .race-info-title .stamp {
      position: absolute;
      right: 8%;
      top: 0;
      font-size: 0.78rem;
      border: 2px solid var(--accent-red);
      color: var(--accent-red);
      padding: 5px 9px;
      background: rgba(240, 220, 180, 0.45);
      transform: rotate(-14deg);
      letter-spacing: 0.14em;
      font-weight: 800;
      box-shadow: 0 2px 0 rgba(163,79,62,0.25);
      z-index: 2;
    }

    .character-slot[data-selected="true"] .character-art {
      box-shadow:
        0 0 0 3px #e0b45a,
        0 0 0 6px rgba(201,164,92,0.35),
        0 10px 18px rgba(43,33,24,0.4);
    }

    .career-card:hover { transform: translateY(-6px) rotate(0deg) !important; z-index: 100 !important; }

    .career-card[data-selected="true"] {
      z-index: 200 !important;
      transform: translateY(-10px) rotate(0deg) !important;
      box-shadow: 0 0 0 2px var(--accent-gold), 4px 6px 0 var(--shadow);
    }

    .race-info-box::before,
    .race-info-box::after {
      display: none;
    }

    .race-info-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 6px;
    }

    .race-info-title {
      font-size: 1.05rem;
      font-weight: 800;
      margin: 0;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }

    .race-info-title .en {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      color: var(--ink-light);
      font-weight: 400;
    }

    .race-info-body {
      font-size: 0.76rem;
      line-height: 1.4;
      color: var(--ink-light);
      max-width: 92%;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .poster-line {
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      margin: 0 0 4px;
    }

    .mission-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .mission-tag {
      border: 1px solid rgba(43,33,24,0.45);
      padding: 3px 8px;
      font-size: 0.68rem;
      cursor: pointer;
      background: transparent;
      color: var(--ink);
      font-family: inherit;
      transition: background 0.2s, color 0.2s;
      position: relative;
    }

    /* 职业卡区域 —— 与种族卡同高带 */
    .career-zone {
      position: relative;
      min-height: 0;
      background: transparent;
      border: none;
      box-shadow: none;
      padding-top: 0;
      align-self: end;
      justify-self: center;
    }

    .career-zone-title {
      text-align: center;
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      margin-bottom: 4px;
      color: var(--ink-light);
    }

    .card-stack {
      position: relative;
      width: 152px;
      height: 188px;
      margin: 0 auto;
    }

    .career-card {
      position: absolute;
      width: 138px;
      height: 180px;
      left: 50%;
      top: 50%;
      margin-left: -69px;
      margin-top: -90px;
      border: 1px solid rgba(43,33,24,0.7);
      background: #efe2c4;
      border-radius: 1px;
      box-shadow: 3px 4px 8px rgba(0,0,0,0.22);
      transform-origin: center bottom;
      transition: transform 0.35s ease, z-index 0s linear 0s;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .career-card:hover { transform: translateY(-6px) rotate(0deg) !important; z-index: 100 !important; }

    .career-card[data-selected="true"] {
      z-index: 200 !important;
      transform: translateY(-10px) rotate(0deg) !important;
      box-shadow: 0 0 0 2px var(--accent-gold), 4px 6px 0 var(--shadow);
    }

    .career-card-back {
      background:

      if (!raceId) {
        raceInfoName.textContent = "请选择一个种族";

        raceInfoStamp.style.display = "none";
        raceInfoStamp.setAttribute("aria-hidden", "true");
        if (crest) crest.dataset.race = "";
        return;
      }
      const r = RACE_DATA[raceId];
      raceInfoName.textContent = r.name;
      raceInfoEn.textContent = r.en;
      raceInfoBody.textContent = r.desc;
      raceInfoStamp.style.display = "flex";
      raceInfoStamp.setAttribute("aria-hidden", "false");
      if (crest) crest.dataset.race = raceId;
    }

    function layoutCareerCards(selectedId) {
      const cards = [...document.querySelectorAll("#cardStack .career-card")];
      if (!cards.length) return;
      const front = selectedId
        ? cards.find((c) => c.dataset.careerId === selectedId) || cards[0]
        : cards[0];
      const peeks = cards.filter((c) => c !== front);
      cards.forEach((card) => {
        card.classList.add("is-peek");
        card.dataset.selected = "false";
      });
      front.classList.remove("is-peek");
      // 仅在真实选中职业时打「已选」
      if (selectedId && state.career === selectedId) {
        front.dataset.selected = "true";
      }
      front.style.zIndex = "40";
      front.style.transform = "translate(0px, 0px) rotate(-2.4deg)";
      // 同尺寸标题条阶梯：矮背卡，不压页签
      const stepX = 52;
      const stepY = 62;
      peeks.forEach((card, oi) => {
        card.style.zIndex = String(30 - oi);
        const x = stepX * (oi + 1);
        const y = stepY * (oi + 1);
        const rot = 1.8 + oi * 1.4;
        card.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg)`;
      });
    }

          c.style.zIndex = String(30 - i);
          cardStack.appendChild(c);
        });
        return;

        const card = document.createElement("button");

        const artStyle = artUrl
          ? `background-image:linear-gradient(180deg, transparent 55%, rgba(43,33,24,0.25)), url('${artUrl}')`
          : `background:linear-gradient(135deg, ${RACE_DATA[raceId].color}22, ${RACE_DATA[raceId].color}55)`;
        const en = career.id.replace("guild_", "").toUpperCase();
        card.innerHTML = `
          <div class="card-selected-mark" aria-hidden="true">已选</div>
          <div class="card-head">
            <span class="card-shield" aria-hidden="true"></span>
            <h4 class="card-title">${career.name}<span class="card-title-en"> ${en}</span></h4>
          </div>
          <div class="card-art" style="${artStyle}" aria-hidden="true"></div>
          <div class="card-body">
            <div class="card-location">${career.location}</div>
            <div class="card-desc">${career.desc}</div>
          </div>
        `;
        card.addEventListener("click", () => selectCareer(career.id));
        cardStack.appendChild(card);
      });
      if (state.career && careers.some((c) => c.id === state.career)) {
        layoutCareerCards(state.career);
      } else {
        layoutCareerCards(null);
      }
    }

    function selectRace(raceId) {
      if (state.locked) return;
      state.race = raceId;
      state.career = null;
      document.querySelectorAll(".character-slot").forEach((slot) => {
        const isSelected = slot.dataset.race === raceId;
        slot.dataset.selected = isSelected;
        slot.setAttribute("aria-pressed", isSelected);
      });
      updateRaceInfo(raceId);
      renderCareers(raceId);
      const first = RACE_DATA[raceId]?.careers?.[0];
      if (first) {
        selectCareer(first.id);
      } else {
        updateAcceptBtn();
      }
    }

    function selectCareer(careerId) {
      if (state.locked) return;
      state.career = careerId;
      layoutCareerCards(careerId);
      updateAcceptBtn();
    }

    function updateAcceptBtn() {
      const label = acceptBtn.querySelector(".accept-label") || acceptBtn;
      if (state.race && state.career) {
        acceptBtn.disabled = false;
        const raceName = RACE_DATA[state.race].name;
        const careerName = RACE_DATA[state.race].careers.find(c => c.id === state.career).name;
        label.textContent = `接受征召：${raceName} · ${careerName} —>`;
      } else {
        acceptBtn.disabled = true;
        label.textContent = "接受征召：尚不可用";
      }
    }

    function renderPanel(panelId) {
      const data = PANEL_DATA[panelId];
      panelContent.innerHTML = `<h3 style="margin-top:0">${data.title}</h3>${data.body}`;
      if (panelId === "purpose") renderMissionTags();
      document.querySelectorAll(".panel-tab").forEach((tab) => tab.dataset.active = (tab.dataset.panel === panelId));
    }

    let lastMissionTrigger = null;
    const mobileQuery = window.matchMedia("(max-width: 900px)");
    function isMobileLayout() { return mobileQuery.matches; }

    function missionDetailHtml(m) {
      return `
        <div class="modal-section"><h4>任务简介</h4><p>${m.summary}</p></div>
        <div class="modal-section"><h4>任务目标</h4><ul>${m.goals.map(g => `<li>${g}</li>`).join("")}</ul></div>
        <div class="guild-note"><strong>工会备注：</strong>${m.note}</div>
      `;
    }

    function renderMissionTags() {
      const container = document.getElementById("missionTags");
      if (!container) return;
      const icons = ["ico-shield", "ico-compass", "ico-skull", "ico-leaf", "ico-book"];
      container.innerHTML = Object.keys(MISSIONS).map((name, i) => `
        <button class="mission-block" type="button" data-mission="${name}" data-active="${name === state.mission}" aria-expanded="false">
          <span class="mission-ico ${icons[i % icons.length]}" aria-hidden="true"></span>
          <span class="mission-copy">
            <span class="mission-name">${name}</span>
            <span class="mission-hint">${MISSIONS[name].goals[0]}</span>
          </span>
        </button>
      `).join("");
      container.querySelectorAll(".mission-block").forEach((tag) => {
        tag.addEventListener("click", () => {
          openMissionModal(tag.dataset.mission, tag);
        });
      });
    }

    // 移动端：五个任务标签改为纵向列表，点击后在标签下方展开详情，同一时间只展开一个
    function toggleInlineMission(name, triggerEl) {
      const item = triggerEl.closest(".mission-item");
      const wasOpen = triggerEl.getAttribute("aria-expanded") === "true";
      document.querySelectorAll(".mission-item").forEach((it) => {
        const btn = it.querySelector(".mission-tag");
        const detail = it.querySelector(".mission-inline-detail");
        btn.setAttribute("aria-expanded", "false");
        btn.dataset.active = "false";
        detail.hidden = true;
        detail.innerHTML = "";
      });
      if (!wasOpen) {
        const detail = item.querySelector(".mission-inline-detail");
        detail.innerHTML = missionDetailHtml(MISSIONS[name]);
        detail.hidden = false;
        triggerEl.setAttribute("aria-expanded", "true");
        triggerEl.dataset.active = "true";
        state.mission = name;
      } else {
        state.mission = null;
      }
    }

    function openMissionModal(name, triggerEl) {
      const m = MISSIONS[name];
      state.mission = name;
      lastMissionTrigger = triggerEl || document.activeElement;
      document.querySelectorAll(".mission-tag").forEach((tag) => {
        tag.dataset.active = String(tag.dataset.mission === name);
      });
      modalTitle.textContent = name;
      modalBody.innerHTML = missionDetailHtml(m);
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
      modalTitle.focus();
    }

    function closeModal() {
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      if (lastMissionTrigger) {
        lastMissionTrigger.focus();
        lastMissionTrigger = null;
      }
    }

    function acceptRecruitment() {
      if (state.locked) return;
      if (!state.race || !state.career) return;
      state.locked = true;
      acceptZone.classList.add("stamped");
      acceptBtn.disabled = true;
      document.querySelectorAll(".character-slot, .career-card").forEach((el) => {
        el.disabled = true;
        el.setAttribute("aria-disabled", "true");
      });
      setTimeout(() => {
        transitionScreen.classList.add("open");
        transitionScreen.setAttribute("aria-hidden", "false");
      }, 900);
      // 盖章后进入主站职业检验，带上血脉与志愿
      setTimeout(() => {
        const next = new URL("index.html", window.location.href);
        next.searchParams.set("from", "hall");
        next.searchParams.set("race", state.race);
        next.searchParams.set("target", state.career);
        window.location.href = next.toString();
      }, 2200);
    }

    characters.addEventListener("click", (e) => {
      const slot = e.target.closest(".character-slot");
      if (slot) selectRace(slot.dataset.race);
    });

    panelTabs.addEventListener("click", (e) => {
      const tab = e.target.closest(".panel-tab");
      if (tab) {
        state.panel = tab.dataset.panel;
        renderPanel(state.panel);
      }
    });

    modalClose.addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && modal.classList.contains("open")) closeModal(); });

    acceptBtn.addEventListener("click", acceptRecruitment);

    renderPanel("purpose");
    selectRace("human");
    selectCareer("guild_fighter");
  </script>
