<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#24170f">
  <link rel="icon" href="data:,">
  <title>世界征召令 | 世界冒险者工会</title>
  <link rel="stylesheet" href="./world-recruitment-prototype.css">
</head>
<body>
  <div class="stage-viewport" id="stageViewport">
  <main class="recruitment-desk" id="recruitmentDesk">
    <img class="notice-sheet-layer" src="./assets/recruitment/sheets/recruitment-notice-sheet-v2.png" alt="" aria-hidden="true">
    <img class="dossier-sheet-layer" src="./assets/recruitment/sheets/recruitment-career-dossier-v2.png" alt="" aria-hidden="true">
    <section class="notice-paper" aria-labelledby="noticeTitle">
      <header class="notice-head">
        <div class="guild-mark" aria-hidden="true"><span>界</span></div>
        <div class="notice-title-copy">
          <p>世界冒险者工会联合发布</p>
          <h1 id="noticeTitle">世界征召令</h1>
          <span>WORLD ADVENTURERS GUILD · GENERAL RECRUITMENT</span>
        </div>
        <div class="issue-mark" aria-label="第七期世界征召">第七期<br>紧急增刊</div>
      </header>

      <section class="roster-section" aria-label="选择种族">
        <div class="section-rule">
          <strong>今日招募</strong>
          <span>从人物画像中选择种族</span>
        </div>
        <div class="race-scroll" id="raceScroll">
          <div class="roster-scene" aria-hidden="true"></div>
          <div class="race-roster" id="raceRoster"></div>
        </div>
        <article class="race-caption" id="raceCaption" aria-live="polite">
          <span class="caption-pointer" aria-hidden="true"></span>
          <div class="caption-index">种族档案</div>
          <div>
            <h2 id="raceCaptionTitle">请选择一名征召候选人</h2>
            <p id="raceCaptionBody">种族决定可申请的职业路线，不影响职业检验的最终成绩。</p>
          </div>
          <span class="caption-stamp" id="raceCaptionStamp" aria-hidden="true">待登记</span>
        </article>
      </section>

      <section class="notice-information" aria-label="征召信息">
        <nav class="notice-tabs" id="noticeTabs" role="tablist" aria-label="征召令栏目"></nav>
        <div class="notice-copy" id="noticeCopy" role="tabpanel"></div>
      </section>

      <footer class="acceptance-block">
        <div class="selection-summary" id="selectionSummary">种族未登记 · 职业未登记</div>
        <button class="accept-button" id="acceptButton" type="button" disabled>
          <span class="button-crest" aria-hidden="true">界</span>
          <span id="acceptLabel">选择种族与职业后接受征召</span>
        </button>
        <div class="wax-seal" id="waxSeal" aria-hidden="true">
          <img src="./assets/recruitment/seals/wax-seal-blank-v1.png" alt="">
          <img src="./assets/recruitment/seals/wax-seal-guild-emblem-v1.png" alt="">
        </div>
      </footer>
    </section>

    <aside class="career-dossier" aria-label="职业选择">
      <div class="dossier-pin" aria-hidden="true"></div>
      <header class="dossier-head">
        <p>职业档案 · CLASS FILE</p>
        <h2 id="careerHeading">先选择种族</h2>
      </header>
      <div class="career-selector">
        <div class="career-bookmarks" id="careerBookmarks" role="tablist" aria-label="职业书签"></div>
        <article class="career-card" id="careerCard" aria-live="polite"></article>
      </div>
      <p class="dossier-hint" id="dossierHint">种族登记后，对应的四份职业档案会在这里展开。</p>
    </aside>

    <img class="desk-quill" src="./assets/ui/recruitment-kit-v2/prop_quill.png" alt="" aria-hidden="true">
    <img class="desk-compass" src="./assets/ui/recruitment-kit-v2/compass_coin.png" alt="" aria-hidden="true">
    <img class="desk-stamp" src="./assets/recruitment/seals/guild-stamp-v1.png" alt="" aria-hidden="true">
    <img class="desk-seal" src="./assets/recruitment/seals/wax-seal-guild-emblem-v1.png" alt="" aria-hidden="true">
  </main>
  </div>

  <dialog class="mission-dialog" id="missionDialog" aria-labelledby="missionDialogTitle">
    <button class="dialog-close" id="dialogClose" type="button" aria-label="关闭任务详情">×</button>
    <p>世界冒险者工会 · 任务附页</p>
    <h2 id="missionDialogTitle">任务详情</h2>
    <div id="missionDialogBody"></div>
  </dialog>

  <div class="handoff-screen" id="handoffScreen" aria-hidden="true">
    <img src="./assets/recruitment/seals/guild-ink-imprint-v1.png" alt="">
    <h2>征召登记完成</h2>
    <p id="handoffCopy">正在清理桌面并移交职业检验档案</p>
  </div>

  <script src="./world-recruitment-prototype.js"></script>
</body>
</html>
